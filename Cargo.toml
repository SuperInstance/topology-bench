[package]
name = "topology-bench"
version = "0.1.0"
edition = "2021"
description = "CLI/library for benchmarking graph topologies in the Grand Pattern ecosystem"
license = "MIT"
repository = "https://github.com/SuperInstance/topology-bench"

[dependencies]
clap = { version = "4", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
